{% set name = "metatensor-torch" %}
{% set version = "0.10.8" %}

package:
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/metatensor_torch-{{ version }}.tar.gz
  sha256: 31426d0a5934f21d3734cec6085555377143406e91798a5bf51505d017b66050

build:
  number: 1

outputs:
  - name: python-{{ name|lower }}
    version: {{ version }}

    build:
      ignore_run_exports:
        - libtorch
        - pytorch
      script: python -m pip install . -vv --no-deps --no-build-isolation
      script_env:
        # Don't build metatensor-torch, but use the already compiled `libmetatensor-torch`
        # package
        - METATENSOR_TORCH_PYTHON_USE_EXTERNAL_LIB='ON'

    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - pytorch                                # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        # Nothing will be built but we need a correct env to make pip happy
        - {{ compiler('cxx') }}
        - {{ stdlib("c") }}
        - cmake
        - make
      host:
        - python
        - setuptools >=77
        - packaging >=23
        # We build against the CPU version of torch to not have to deal with
        # CUDA compilers (torch's CMake targets tries to find CUDA compilers
        # even when there is no CUDA code to build). This does not impact the
        # `run` dependency, since torch's `run_exports` are variant agnostic
        - libtorch * cpu*
        - libtorch
        - pytorch
        - pip
        - libmetatensor-torch {{ version }}
        - python-metatensor-core >=0.2.2,<0.3
      run:
        - python
        - pytorch
        - libmetatensor-torch {{ version }}
        - python-metatensor-core >=0.2.2,<0.3

    test:
      imports:
        - metatensor
      commands:
        - pip check
      requires:
        - pip

  # This produces a `metatensor-torch` meta-package, only containing
  # dependencies on sub-packages
  - name: {{ name|lower }}
    version: {{ version }}
    build:
      noarch: generic

    requirements:
      run:
        - libmetatensor-torch {{ version }}
        - python-metatensor-torch {{ version }}
        - python-metatensor-operations >=0.5.0,<0.6
        - python-metatensor-learn >=0.5.0,<0.6

    test:
      imports:
        - metatensor
      commands:
        - pip check
      requires:
        - pip


about:
  home: https://github.com/metatensor/metatensor
  summary: Python bindings for metatensor-torch
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: docs.metatensor.org

extra:
  recipe-maintainers:
    - HaoZeke
    - PicoCentauri
    - Luthaf
